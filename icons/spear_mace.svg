<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="spearDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <linearGradient id="spearBladeL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#d5e1df"/>
      <stop offset="100%" stop-color="#7f9c9b"/>
    </linearGradient>
    <linearGradient id="spearBladeR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b2bec3"/>
      <stop offset="60%" stop-color="#636e72"/>
      <stop offset="100%" stop-color="#2d3436"/>
    </linearGradient>
    <linearGradient id="woodShaft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8d5524"/>
      <stop offset="50%" stop-color="#5c3818"/>
      <stop offset="100%" stop-color="#2d1b0b"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="60%" stop-color="#fdcb6e"/>
      <stop offset="100%" stop-color="#e17055"/>
    </linearGradient>
    <linearGradient id="steelRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecf0f1"/>
      <stop offset="50%" stop-color="#bdc3c7"/>
      <stop offset="100%" stop-color="#7f8c8d"/>
    </linearGradient>
  </defs>

  <g filter="url(#spearDropShadow)">
    <!-- 1. SPEAR SHAFT (Diagonal from bottom-left up to the Heavy Core) -->
    <path d="M 44 436 L 68 460 L 220 308 L 196 284 Z" fill="url(#woodShaft)" stroke="#1a1108" stroke-width="4"/>

    <!-- Pommel at base -->
    <path d="M 28 452 L 52 476 L 68 460 L 44 436 Z" fill="url(#steelRing)" stroke="#1a1108" stroke-width="4"/>
    <circle cx="48" cy="456" r="6" fill="#ffeaa7" stroke="#b7791f" stroke-width="2"/>

    <!-- Gold Grip Band -->
    <path d="M 96 384 L 116 404 L 132 388 L 112 368 Z" fill="url(#goldAcc)" stroke="#1a1108" stroke-width="3"/>
    <path d="M 148 332 L 168 352 L 184 336 L 164 316 Z" fill="url(#goldAcc)" stroke="#1a1108" stroke-width="3"/>

    <!-- Socket Collar below Heavy Core -->
    <path d="M 188 292 L 216 320 L 236 300 L 208 272 Z" fill="url(#steelRing)" stroke="#1a1108" stroke-width="4"/>

    <!-- 2. HEAVY CORE (Mounted on the spear collar) -->
    <!-- Heavy Core 3D Isometric Block at (center approx 260, 240) -->
    <!-- Left Face -->
    <polygon points="208,248 268,284 268,348 208,312" fill="#5e656f" stroke="#1a1108" stroke-width="4" stroke-linejoin="round"/>
    <!-- Left Face Inner Recessed Core -->
    <polygon points="224,268 252,284 252,324 224,308" fill="#202020" stroke="#3d3f43" stroke-width="2"/>

    <!-- Right Face -->
    <polygon points="268,284 328,248 328,312 268,348" fill="#4e5259" stroke="#1a1108" stroke-width="4" stroke-linejoin="round"/>
    <!-- Right Face Inner Recessed Core -->
    <polygon points="284,284 312,268 312,308 284,324" fill="#1b1b1b" stroke="#313436" stroke-width="2"/>

    <!-- Top Face (Heavy Core Top) -->
    <polygon points="268,220 328,248 268,284 208,248" fill="#9299ab" stroke="#1a1108" stroke-width="4" stroke-linejoin="round"/>
    <!-- Top Face Metallic Ring Pattern -->
    <polygon points="268,236 306,248 268,266 230,248" fill="#3d3f43" stroke="#7c8293" stroke-width="2"/>

    <!-- Heavy Core Metallic Corner Reinforcements -->
    <circle cx="268" cy="220" r="5" fill="#ffeaa7" stroke="#1a1108" stroke-width="2"/>
    <circle cx="208" cy="248" r="5" fill="#dfe6e9" stroke="#1a1108" stroke-width="2"/>
    <circle cx="328" cy="248" r="5" fill="#dfe6e9" stroke="#1a1108" stroke-width="2"/>
    <circle cx="268" cy="348" r="5" fill="#dfe6e9" stroke="#1a1108" stroke-width="2"/>

    <!-- 3. SPEARHEAD (Emerging right from the top of the Heavy Core!) -->
    <!-- Spear Socket Collar on top of Heavy Core -->
    <polygon points="268,206 288,218 268,228 248,218" fill="url(#steelRing)" stroke="#1a1108" stroke-width="3"/>

    <!-- Left Wing / Barb -->
    <path d="M 250 216 L 194 216 L 244 156 Z" fill="url(#spearBladeL)" stroke="#1a1108" stroke-width="4" stroke-linejoin="round"/>
    <!-- Right Wing / Barb -->
    <path d="M 286 216 L 286 160 L 342 216 Z" fill="url(#spearBladeR)" stroke="#1a1108" stroke-width="4" stroke-linejoin="round"/>

    <!-- Main Massive Spearhead Blade -->
    <!-- Left Blade Half (Bright highlight) -->
    <path d="M 268,206 L 244,156 L 476,34 L 468,26 Z" fill="url(#spearBladeL)"/>
    <!-- Right Blade Half (Shadowed facet) -->
    <path d="M 268,206 L 342,216 L 476,34 L 484,42 Z" fill="url(#spearBladeR)"/>

    <!-- Outer Razor Edges & Dark Steel Outline -->
    <path d="M 194 216 L 244 156 L 476 34 L 342 216 L 286 216" fill="none" stroke="#1a1108" stroke-width="5" stroke-linejoin="round"/>

    <!-- Center Raised Spine -->
    <line x1="268" y1="206" x2="476" y2="34" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="244" y1="156" x2="476" y2="34" stroke="#e0f7fa" stroke-width="2" opacity="0.9"/>
  </g>
</svg>