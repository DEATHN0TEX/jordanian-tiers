<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="spearBladeL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4f8"/>
      <stop offset="40%" stop-color="#c8d6e5"/>
      <stop offset="100%" stop-color="#8395a7"/>
    </linearGradient>
    <linearGradient id="spearBladeR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b0c4de"/>
      <stop offset="60%" stop-color="#576574"/>
      <stop offset="100%" stop-color="#222f3e"/>
    </linearGradient>
    <linearGradient id="spearEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#70a1ff"/>
    </linearGradient>
    <linearGradient id="shaftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8d5b4c"/>
      <stop offset="50%" stop-color="#5c3a21"/>
      <stop offset="100%" stop-color="#382314"/>
    </linearGradient>
    <linearGradient id="metalRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfe4ea"/>
      <stop offset="50%" stop-color="#a4b0be"/>
      <stop offset="100%" stop-color="#57606f"/>
    </linearGradient>
  </defs>

  <!-- Long diagonal weapon shaft -->
  <path d="M 50 446 L 66 462 L 312 216 L 296 200 Z" fill="url(#shaftGrad)" stroke="#22140a" stroke-width="4"/>

  <!-- Metal Grip Rings -->
  <path d="M 120 376 L 132 388 L 148 372 L 136 360 Z" fill="url(#metalRing)" stroke="#2f3542" stroke-width="2"/>
  <path d="M 190 306 L 202 318 L 218 302 L 206 290 Z" fill="url(#metalRing)" stroke="#2f3542" stroke-width="2"/>

  <!-- Base Pommel -->
  <path d="M 40 456 L 56 472 L 42 486 L 26 470 Z" fill="url(#metalRing)" stroke="#2f3542" stroke-width="3"/>

  <!-- Collar / Socket -->
  <path d="M 290 206 L 306 222 L 328 200 L 312 184 Z" fill="url(#metalRing)" stroke="#2f3542" stroke-width="3"/>
  <path d="M 312 184 L 328 200 L 342 186 L 326 170 Z" fill="#747d8c"/>

  <!-- Left Barb / Wing -->
  <path d="M 316 194 L 274 200 L 314 154 Z" fill="url(#spearBladeL)" stroke="#2f3542" stroke-width="3"/>
  <!-- Right Barb / Wing -->
  <path d="M 334 176 L 340 134 L 386 174 Z" fill="url(#spearBladeR)" stroke="#2f3542" stroke-width="3"/>

  <!-- Main Spearhead Blade (Left facet) -->
  <path d="M 326 170 L 314 154 L 468 38 L 474 44 Z" fill="url(#spearBladeL)"/>
  <!-- Main Spearhead Blade (Right facet) -->
  <path d="M 326 170 L 340 182 L 468 38 L 474 44 Z" fill="url(#spearBladeR)"/>

  <!-- Outer cutting edges -->
  <path d="M 314 154 L 468 38 L 340 182" fill="none" stroke="#2f3542" stroke-width="4" stroke-linejoin="round"/>
  <line x1="314" y1="154" x2="468" y2="38" stroke="#ffffff" stroke-width="2" opacity="0.8"/>

  <!-- Center Spine / Ridge Highlight -->
  <line x1="326" y1="170" x2="468" y2="38" stroke="url(#spearEdge)" stroke-width="4" stroke-linecap="round"/>
</svg>